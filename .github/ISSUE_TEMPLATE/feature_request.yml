name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先说明要解决的问题，再说你希望的方案——这比直接给实现更容易讨论出好结果。

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 胜率榜 / 排名
        - 英雄报告
        - 海克斯查询
        - 数据源（ARAMGG / OP.GG / Mayhempedia）
        - 渲染与图片样式
        - 配置项
        - 性能与缓存
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 现在哪里不顺手？请描述真实场景
      placeholder: 群里有人问「哪个英雄最菜」，但 /海斗排名 只有综合档位，看不到胜率最低的
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 包括你判断不适用的方案，以及原因

  - type: checkboxes
    id: data-consistency
    attributes:
      label: 数据可信度确认
      description: 本项目坚持「缺失就是缺失，不补 0、不推算」。涉及统计展示的建议请确认这一点。
      options:
        - label: 我的建议不会要求插件伪造或推算上游没有提供的统计数据
          required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考实现、竞品截图、相关 API 文档链接等
